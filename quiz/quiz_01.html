<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>quiz_01 이진수 변환 - 재귀함수 (하향식)
</head>

<body>
    <script>
        function func(num) {
            if (num === 0) {
                return '0';
            } else if (num === 1) {
                return '1';
            }

            if (num % 2 === 1) {
                return func(parseInt(num / 2)) + '1';
            } else if (num % 2 === 0) {
                return func(parseInt(num / 2)) + '0';
            }
        }

        console.log(func(123));
    </script>
</body>

</html>
