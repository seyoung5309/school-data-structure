<!DOCTYPE html>
<html lang="en">

<head>
    <title>배열 - 점수 카운팅</title>
</head>

<body>
    <script>
        function solution(arr) {
            let score = 0;
            let check = 0;
            // for (let i = 0; i < arr.length; i++) {
            for (let i of arr) {
                if (i) {
                    check++;
                    score += check;
                } else {
                    check = 0;
                }
            }
            return score;
        }
        let arr = [1, 0, 1, 1, 1, 0, 0, 1, 1, 0];
        console.log(solution(arr));
    </script>
</body>

</html>
