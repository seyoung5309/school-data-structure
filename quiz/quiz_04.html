<!DOCTYPE html>
<html lang="en">

<head>
    <title>스택 - 올바른 괄호</title>
</head>

<body>
    <script>
        function solution(str) {
            let steak = [];
            for (let i of str) {
                if (str[i] === '(') {
                    steak.push(i);
                } else {
                    if (steak.length === 0) {
                        return "NO";
                    }
                    steak.pop()
                }
            }
            if (steak.length !== 0) {
                return "NO";
            }
            return "YES";
        }
        let str = "(()";
        console.log(solution(str));
    </script>
</body>

</html>
