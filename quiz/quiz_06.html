<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>
    <script>
        function solution(str) {
            let r, l;
            let steak = [];
            for (let s of str) {
                if (!isNaN(s)) { // s >= '0' && s <= '9'
                    steak.push(+s);
                } else {
                    r = steak.pop();
                    l = steak.pop();
                    switch (s) {
                        case '+':
                            steak.push(l + r);
                            break;
                        case '-':
                            steak.push(l - r);
                            break;
                        case '*':
                            steak.push(l * r);
                            break;
                        case '/':
                            steak.push(l / r);
                        default:
                            steak.push(l % r);
                    }
                }
            }
            return steak.pop();
        }
        let str = "352+*9-" // 12
        // let str = "35-7*62/+" // -11
        console.log(solution(str));
    </script>
</body>

</html>
