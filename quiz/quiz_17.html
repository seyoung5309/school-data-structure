<!DOCTYPE html>
<html lang="en">

<head>
    <title>그래프 경로 탐색 - 인접 행렬</title>
</head>

<body>
    <script>
        function solution(n, arr) {
            let answer = 0;

            let arr2 = Array.from(Array(n), () => Array(n).fill(0));

            for (let i = 0; i < arr.length; i++) {
                arr2[arr[i][0] - 1][arr[i][1] - 1] = 1;
            }

            /*
            for (let [a, b] of arr) {
                arr[a-1][b-1] = 1;
            }
            */

            function result(start, set, str) {
                if (start === 4) {
                    console.log(str);
                    answer += 1;
                    return;
                } else {
                    for (let i = 0; i < 5; i++) {
                        // console.log(start, i, set);
                        if (arr2[start][i] === 1 && set[i] === 0) {
                            set[i] = 1;
                            result(i, set, str + " " + (i + 1));
                            set[i] = 0;
                        }
                    }
                    return;
                }
            }

            let check = [1, 0, 0, 0, 0];
            // Array.from({length:n}, () => 0); 
            // check[0] = 1;
            result(0, check, "1");

            return answer;
        }
        let arr = [
            [1, 2], [1, 3], [1, 4], [2, 1], [2, 3], [2, 5], [3, 4], [4, 2], [4, 5]
        ]
        console.log(solution(5, arr));
    </script>
</body>

</html>
