<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
</head>

<body>
    <script>
        function solution(s) {
            let answer;
            let stack = [];
            for (let x of s) {
                if (x === ')') {
                    while (true) {
                        let tmp = stack.pop();
                        if (tmp === '(') {
                            break;
                        }
                    }
                } else
                    stack.push(x);
            }
            answer = stack.join('');
            return answer;
        }
        let str = "(A(BC)D)EF(G(H)(IJ)K)LM(N)";
        console.log(solution(str));
    </script>
</body>

</html>
