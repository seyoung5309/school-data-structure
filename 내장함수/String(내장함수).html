<!DOCTYPE html>
<html lang="en">

<head>
    <title>String 내장함수 정리</title>
</head>

<body>
    <script>
        // length : 문자열의 길이를 반환
        let txt = "ABCDEFGHIJKLMNOPQ";
        console.log(txt.length);

        // indexOf() / lastIndexOf() : (대소문자 구분 O)
        var str = "Please locate where 'locate'";
        console.log(str.indexOf("locate"));
        console.log(str.lastIndexOf("locate"));
        console.log(str.indexOf("hello world"));

        let find = "사용자로부터 입력된 문자열";
        if (str.indexOf(find) > -1) {
            console.log(find + " : 문자 발견");
        } else {
            console.log(find + " : 문자 미발견");
        }

        // search (사용 많이 안함)
        console.log(str.search("locate"))

        // (중요) slice(a, b) : a index부터 b - 1 index까지의 문자열을 반환
        var str = "Apple, Banana, Kiwi";
        console.log(str.slice(7, 13));
        console.log(str.slice(7));
        console.log(str.slice(-12, -6));

        // substring(a, b) : slice에서 음수 지원 X
        console.log(str.substring(7, 13));

        //substr(i, s) : a index부터 b 갯수의 문자까지
        console.log(str.substr(7, 6));

        var jumin1 = "070828";
        console.log(jumin1.substr(0, 2),
            jumin1.substr(2, 2),
            jumin1.substr(4, 2));

        var jumin2 = "2007-08-28";
        var jumin3 = "07-08-28"

        console.log(jumin2.substring(0, jumin2.indexOf("-")));
        console.log(jumin3.substring(0, jumin3.indexOf("-")));

        // replace : 
        var str1 = "Please visit here";
        console.log(str1.replace("here", "there"));

        var str3 = "Please visit here here here";
        console.log(str3.replace("here", "there"));

        // 정규 표현식 
        var str5 = "Please visit here here here";
        var str6 = str5.replace(/here/g, "there");
        // g(global): 전역 -> 전부 바꾸기
        console.log(str6);

        var str7 = "Please visit Here HERE HeRe";
        var str8 = str5.replace(/here/i, "there");
        // i(ignore): 무시 -> 대소문자 무시 
        console.log(str8);

        // toLowerCase() / toUpperCase()
        var str = "Please visit here Here here";
        console.log(str.toLowerCase());
        console.log(str.toUpperCase());

        // concat : 문자열 결합
        var txt1 = "Hello";
        var txt2 = "World";
        var txt3 = txt1 + " " + txt2;
        var txt4 = txt1.concat(" " + txt2);
        console.log(txt3);
        console.log(txt4);

        // trim : 문자열 앞뒤의 공백 제거 
        var str10 = "                                   Hello World!              ";
        console.log(str10.trim())

        // padStart() : 특정 자릿수를 통일하기 위해 사용
        var str11 = "11";
        var str12 = "1792";
        console.log(str11.padStart(8, 0));
        console.log(str12.padStart(8, 0));

        var str13 = "7";
        var str14 = "07";
        console.log(str13.padStart(2, 0));
        console.log(str14.padStart(2, 0));

        var str15 = "15";
        console.log(str15.padEnd(8, 0));

        // charAt(a) : a index에 해당하는 문자 하나를 반환
        var str16 = "Hello World!";
        console.log(str16.charAt(0));

        // split : 문자열을 배열로 변환
        var tags = "키보드,기계식,블루투스";
        var arr = tags.split(",");
        console.log(arr);

        // join : 배열을 문자열로 변환
        console.log(arr.join(","));

        var birthday = "2007-08-28";
        var arr = birthday.split("-");
        console.log(arr);
        console.log(arr.join("."));
        console.log(arr.join("/"));
        console.log(arr.join("_"));
    </script>
</body>

</html>
